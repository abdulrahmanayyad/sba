<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" width="100%" height="100%">
  <!-- Icon: Ultrasonic Sensor Waves & Probe -->
  <g transform="translate(8, 8)">
    <!-- Sensor Transducer Body -->
    <rect x="2" y="16" width="20" height="24" rx="4" fill="#0F172A" />
    <rect x="6" y="12" width="12" height="4" rx="1.5" fill="#DC2626" />
    <!-- Ultrasonic Pulse Beams / Wave Arcs -->
    <path d="M 28 14 A 18 18 0 0 1 28 42" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 35 9 A 26 26 0 0 1 35 47" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 42 4 A 34 34 0 0 1 42 52" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none" opacity="0.7" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 12)">
    <!-- Main Acronym DYP -->
    <text x="0" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="1">DYP</text>
    <text x="62" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#DC2626" letter-spacing="1.5">SENSOR</text>
    
    <!-- Full Legal / Division Name -->
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="1.2">SHENZHEN DIANYINGPU TECH</text>
  </g>
</svg>

