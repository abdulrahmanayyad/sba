<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" width="100%" height="100%">
  <!-- Icon: Isometric Tech Hexagon / Compliance Cube -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="techTop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366F1" />
        <stop offset="100%" stop-color="#4F46E5" />
      </linearGradient>
      <linearGradient id="techLeft" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4338CA" />
        <stop offset="100%" stop-color="#312E81" />
      </linearGradient>
      <linearGradient id="techRight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981" />
        <stop offset="100%" stop-color="#059669" />
      </linearGradient>
    </defs>
    <!-- Isometric Cube / Smart System Polygon -->
    <!-- Top Face -->
    <polygon points="26,6 45,17 26,28 7,17" fill="url(#techTop)" />
    <!-- Left Face -->
    <polygon points="7,17 26,28 26,49 7,38" fill="url(#techLeft)" />
    <!-- Right Face -->
    <polygon points="26,28 45,17 45,38 26,49" fill="url(#techRight)" />
    <!-- Center Smart Node -->
    <circle cx="26" cy="28" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(66, 12)">
    <!-- Wordmark TechnoSet -->
    <text x="0" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" fill="#0F172A" letter-spacing="0.5">Techno<tspan fill="#4F46E5">Set</tspan></text>
    
    <!-- Subtitle: Enterprise Applications & QHSE -->
    <text x="1" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="1.2">ENTERPRISE QHSE &amp; SYSTEMS</text>
  </g>
</svg>

